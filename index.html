<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="DS Lab Portal - Clean and Professional Data Science Laboratory Website">
  <title>DS Lab Portal | Data Science Laboratory</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
<div class="app">
  <!-- Top Navigation Header -->
  <header class="header">
    <div class="logo">
      <div class="logo-mark">DS</div>
      <span>DS Lab Portal</span>
    </div>

    <nav class="nav">
      <a href="#/home" data-route="home">Home</a>
      <a href="#/executions" data-route="executions">Lab Executions</a>
      <a href="#/tools" data-route="tools">Tools</a>
      <a href="#/profile" data-route="profile">Profile</a>
      <a href="#/edit" data-route="edit" class="nav-edit-btn" style="background: rgba(99,102,241,0.15); border: 1px solid var(--accent-a); color: var(--accent-b); font-weight: 600;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right: 4px;">
          <path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
        </svg>
        Edit Options
      </a>
    </nav>

    <div class="header-right">
      <div class="db-indicator" id="db-status-badge" title="SQLite Database Status">
        <span class="db-dot"></span>
        <span id="db-status-text">SQLite Synced</span>
      </div>

      <button class="btn ghost" style="padding: 6px 12px; font-size: 13px; min-height: 38px; border: 1px solid var(--line-strong);" onclick="window.setProfileMode('edit'); location.hash='#/profile';" title="Quick Edit Profile">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
        </svg>
        Edit Profile
      </button>

      <button class="theme-btn" id="theme-toggle" aria-label="Toggle dark/light theme" title="Toggle Theme">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- Main Dynamic View Container -->
  <main id="app" class="container"></main>

  <!-- Global Footer -->
  <footer class="footer">
    <div style="max-width: 800px; margin: 0 auto; line-height: 1.6;">
      <strong>DS Lab Portal</strong> &bull; Data Science Laboratory &bull; Department of Data Science
      <div style="margin-top: 4px; color: var(--fg-subtle);">
        Python 3 &bull; SQLite &bull; Pandas &bull; Scikit-learn &bull; Matplotlib
      </div>
    </div>
  </footer>

  <!-- Mobile Bottom Tab Bar -->
  <nav class="bottom-nav" aria-label="Mobile Navigation">
    <a href="#/home" data-route="home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12l9-9 9 9M5 10v10h14V10"/></svg>
      <span>Home</span>
    </a>
    <a href="#/executions" data-route="executions">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
      <span>Executions</span>
    </a>
    <a href="#/tools" data-route="tools">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
      <span>Tools</span>
    </a>
    <a href="#/profile" data-route="profile">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></svg>
      <span>Profile</span>
    </a>
    <a href="#/edit" data-route="edit">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
      <span>Edit</span>
    </a>
  </nav>
</div>

<!-- Modal Dialog Host -->
<div class="modal-overlay" id="portal-modal" role="dialog" aria-modal="true">
  <div class="modal-card" id="modal-card-content">
    <!-- Populated dynamically -->
  </div>
</div>

<!-- Toast Notifications -->
<div class="toast-container" id="toast-container"></div>

<!-- Scripts (with cache-busting) -->
<script src="assets/js/data.js?v=3"></script>
<script src="assets/js/app.js?v=3"></script>
</body>
</html>
