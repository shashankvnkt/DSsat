<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <rect width="600" height="340" fill="#0d1324" rx="12"/>
  <rect x="20" y="20" width="560" height="40" fill="#151e36" rx="8"/>
